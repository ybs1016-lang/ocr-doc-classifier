<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문서 분석기 · OCR 문서 분류 및 검증</title>
<style>
  :root{
    --ink:#1b2333;
    --ink-soft:#4a5468;
    --paper:#f6f3ec;
    --paper-line:#dcd6c6;
    --card:#ffffff;
    --accent:#2f5d8a;
    --accent-dark:#203f5e;
    --stamp:#a13d3d;
    --ok:#2f6d4f;
    --warn:#a13d3d;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    line-height:1.55;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:56px 24px 96px;
  }
  header{
    border-bottom:1px solid var(--paper-line);
    padding-bottom:28px;
    margin-bottom:40px;
  }
  .kicker{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
    margin:0 0 10px;
  }
  h1{
    font-size:30px;
    margin:0 0 10px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:15px;
    max-width:56ch;
  }

  .dropzone{
    display:block;
    position:relative;
    border:1.5px dashed var(--paper-line);
    border-radius:var(--radius);
    background:var(--card);
    padding:48px 24px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--accent);
    background:#fbfaf6;
  }
  .dropzone input{
    position:absolute; inset:0; opacity:0; cursor:pointer;
  }
  .dz-icon{
    display:block;
    width:40px; height:40px; margin:0 auto 16px;
    color:var(--accent);
  }
  .dz-title{
    font-size:16px; font-weight:600; margin-bottom:6px;
  }
  .dz-sub{
    font-size:13px; color:var(--ink-soft);
  }

  .file-row{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:16px;
    padding:14px 16px;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
  }
  .file-row.show{ display:flex; }
  .file-meta{ display:flex; align-items:center; gap:12px; min-width:0; }
  .file-meta svg{ flex-shrink:0; color:var(--accent); }
  .file-name{
    font-size:14px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .file-size{ font-size:12px; color:var(--ink-soft); }
  .file-remove{
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft); font-size:13px;
    padding:4px 8px;
  }
  .file-remove:hover{ color:var(--stamp); }

  .actions{
    margin-top:20px;
    display:flex;
    gap:12px;
    align-items:center;
  }
  button.primary{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:12px 24px;
    font-size:14px;
    font-weight:600;
    border-radius:var(--radius);
    cursor:pointer;
    transition:background .15s ease;
  }
  button.primary:hover:not(:disabled){ background:var(--accent-dark); }
  button.primary:disabled{
    background:#c7c2b4; cursor:not-allowed;
  }
  .status-line{
    font-size:13px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .spinner{
    width:14px; height:14px;
    border:2px solid var(--paper-line);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .8s linear infinite;
    display:none;
  }
  .spinner.show{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }


  /* ── 분석 진행 카드 ─────────────────────────────────────────── */
  .progress-card{
    display:none;
    margin-top:28px;
    padding:20px 24px 18px;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
  }
  .progress-card.show{ display:block; }
  .progress-head{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:16px; margin-bottom:12px;
  }
  .progress-title{
    font-size:14px; font-weight:700; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .progress-elapsed{
    font-size:13px; color:var(--ink-soft); white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .progress-row{ display:flex; align-items:center; gap:12px; }
  .progress-track{
    flex:1; height:8px; background:#efece2;
    border-radius:100px; overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0; background:var(--accent);
    border-radius:100px; transition:width .4s ease;
  }
  /* AI 응답 대기 구간은 소요 시간을 예측할 수 없어 줄무늬 애니메이션으로 "진행 중"임을 표시 */
  .progress-card.is-ai .progress-fill{
    background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.30) 0, rgba(255,255,255,.30) 8px, rgba(255,255,255,0) 8px, rgba(255,255,255,0) 16px);
    background-size:22.6px 22.6px;
    animation:stripes 1s linear infinite;
  }
  @keyframes stripes{ to{ background-position:22.6px 0; } }
  .progress-card.failed .progress-fill{ background:var(--warn); }
  .progress-pct{
    min-width:40px; text-align:right; font-size:13px; font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .steps{ list-style:none; margin:16px 0 0; padding:0; }
  .steps li{
    display:flex; align-items:center; gap:10px;
    padding:5px 0; font-size:14px; color:#9a9587;
  }
  .steps .mark{
    width:18px; height:18px; flex-shrink:0; box-sizing:border-box;
    border:1.5px solid var(--paper-line); border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; line-height:1; color:#fff;
  }
  .steps li.done{ color:var(--ok); }
  .steps li.done .mark{ background:var(--ok); border-color:var(--ok); }
  .steps li.done .mark::after{ content:'\2713'; }
  .steps li.active{ color:var(--ink); font-weight:600; }
  .steps li.active .mark{
    border-color:var(--accent); border-top-color:transparent;
    animation:spin .8s linear infinite;
  }
  .steps li.failed{ color:var(--warn); font-weight:600; }
  .steps li.failed .mark{ background:var(--warn); border-color:var(--warn); }
  .steps li.failed .mark::after{ content:'!'; }
  .progress-msg{ margin-top:12px; font-size:13px; color:var(--ink-soft); min-height:1.4em; }
  @media (prefers-reduced-motion: reduce){
    .progress-card.is-ai .progress-fill, .steps li.active .mark{ animation:none; }
  }

  #result{ margin-top:40px; display:none; }
  #result.show{ display:block; }

  .result-card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .result-head{
    padding:20px 24px;
    border-bottom:1px solid var(--paper-line);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
  }
  .result-file{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .result-category{
    font-size:22px;
    font-weight:700;
  }
  .badge{
    font-size:12px;
    font-weight:700;
    padding:5px 12px;
    border-radius:100px;
    white-space:nowrap;
  }
  .badge.ok{ background:#e6efe8; color:var(--ok); }
  .badge.warn{ background:#f3e5e2; color:var(--warn); }

  .result-body{ padding:24px; }
  .field-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #efece2;
    font-size:14px;
  }
  .field-row:last-of-type{ border-bottom:none; }
  .field-label{ color:var(--ink-soft); }
  .field-value{ font-weight:600; }

  .confidence-bar{
    width:140px; height:6px; background:#efece2;
    border-radius:100px; overflow:hidden;
  }
  .confidence-fill{
    height:100%; background:var(--accent);
  }
  .confidence-wrap{ display:flex; align-items:center; gap:10px; }
  .confidence-pct{ font-weight:600; font-size:13px; min-width:40px; text-align:right; }

  .anomalies{
    margin-top:18px;
    padding:16px 18px;
    background:#f9f1ef;
    border:1px solid #e6d3ce;
    border-radius:var(--radius);
  }
  .anomalies-title{
    font-size:13px; font-weight:700; color:var(--stamp);
    margin-bottom:8px;
  }
  .anomalies ul{
    margin:0; padding-left:18px; font-size:13px; color:var(--ink);
  }
  .anomalies li{ margin-bottom:4px; }
  .anomalies li:last-child{ margin-bottom:0; }

  .error-box{
    margin-top:40px;
    padding:18px 20px;
    background:#f9f1ef;
    border:1px solid #e6d3ce;
    border-radius:var(--radius);
    color:var(--stamp);
    font-size:14px;
    display:none;
  }
  .error-box.show{ display:block; }

  footer{
    margin-top:64px;
    padding-top:20px;
    border-top:1px solid var(--paper-line);
    font-size:12px;
    color:var(--ink-soft);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">eGovFrame Boot · Spring AI(Ollama)</p>
    <h1>문서 분석기</h1>
    <p>PDF를 업로드하면 텍스트 추출(PDFBox) 또는 OCR 보완 후, AI가 문서 종류를 분류하고 내용의 이상 여부를 검증합니다.</p>
  </header>

  <label class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept="application/pdf,.pdf">
    <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
      <path d="M14 3v5h5"/>
      <path d="M9.5 14.5l2-2 2 2M11.5 12.5V18"/>
    </svg>
    <div class="dz-title">PDF 파일을 이곳에 끌어다 놓거나 클릭해서 선택하세요</div>
    <div class="dz-sub">최대 20MB · .pdf 파일만 지원</div>
  </label>

  <div class="file-row" id="fileRow">
    <div class="file-meta">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
        <path d="M14 3v5h5"/>
      </svg>
      <div>
        <div class="file-name" id="fileName"></div>
        <div class="file-size" id="fileSize"></div>
      </div>
    </div>
    <button class="file-remove" id="fileRemove">제거</button>
  </div>

  <div class="actions">
    <button class="primary" id="analyzeBtn" disabled>분석 시작</button>
    <span class="status-line" id="statusLine">
      <span class="spinner" id="spinner"></span>
      <span id="statusText"></span>
    </span>
  </div>

  <section class="progress-card" id="progressCard" aria-live="polite">
    <div class="progress-head">
      <span class="progress-title" id="progressTitle">분석 진행 중</span>
      <span class="progress-elapsed" id="progressElapsed">0초</span>
    </div>
    <div class="progress-row">
      <div class="progress-track" id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <ol class="steps" id="steps">
      <li data-step="0"><span class="mark"></span><span id="stepQueuedLabel">접수·대기</span></li>
      <li data-step="1"><span class="mark"></span><span>PDF 분석</span></li>
      <li data-step="2"><span class="mark"></span><span id="stepExtractLabel">텍스트 추출</span></li>
      <li data-step="3"><span class="mark"></span><span>AI 분류·검증</span></li>
    </ol>
    <div class="progress-msg" id="progressMsg"></div>
  </section>

  <div class="error-box" id="errorBox"></div>

  <div id="result">
    <div class="result-card">
      <div class="result-head">
        <div>
          <div class="result-file" id="resFile"></div>
          <div class="result-category" id="resCategory"></div>
        </div>
        <span class="badge" id="resBadge"></span>
      </div>
      <div class="result-body">
        <div class="field-row">
          <span class="field-label">분류 신뢰도</span>
          <span class="confidence-wrap">
            <span class="confidence-bar"><span class="confidence-fill" id="confFill"></span></span>
            <span class="confidence-pct" id="confPct"></span>
          </span>
        </div>
        <div class="field-row">
          <span class="field-label">텍스트 추출 방식</span>
          <span class="field-value" id="resMethod"></span>
        </div>
        <div class="field-row" id="resTimeRow">
          <span class="field-label">소요 시간</span>
          <span class="field-value" id="resTime"></span>
        </div>
        <div id="anomaliesWrap"></div>
      </div>
    </div>
  </div>

  <footer>POST /api/v1/documents/analyze 로 직접 호출할 수도 있습니다.</footer>
</div>

<script>
  /*
   * 문서 분석기 업로드 화면 스크립트.
   *
   * 역할: PDF 파일 선택(드래그앤드롭/클릭) → 클라이언트 측 유효성 검사
   *       → POST /api/v1/documents/jobs 로 접수 (즉시 작업 ID 를 돌려받는다)
   *       → GET  /api/v1/documents/jobs/{id} 를 1초마다 조회해 진행 상황(단계·진행률·경과 시간) 표시
   *       → 작업이 끝나면 결과(AnalysisResponse)를 화면에 렌더링.
   *       별도 프레임워크 없이 순수 JS로 구현.
   *
   * 분석은 서버의 백그라운드 스레드에서 진행되므로 HTTP 연결을 오래 붙잡지 않는다.
   * 새로고침해도 진행 중인 작업을 이어서 볼 수 있도록 작업 ID 를 sessionStorage 에 보관한다.
   */

  // ── 상수 ───────────────────────────────────────────────────────
  const API_BASE = '/api/v1/documents';
  const POLL_INTERVAL_MS = 1000;     // 상태 조회 주기
  const MAX_POLL_ERRORS = 5;         // 연속으로 이만큼 실패하면 조회를 멈추고 안내한다
  const JOB_STORAGE_KEY = 'ocr-doc-classifier.jobId';

  // ── DOM 엘리먼트 참조 ──────────────────────────────────────────
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const fileRow = document.getElementById('fileRow');
  const fileName = document.getElementById('fileName');
  const fileSize = document.getElementById('fileSize');
  const fileRemove = document.getElementById('fileRemove');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const spinner = document.getElementById('spinner');
  const statusText = document.getElementById('statusText');
  const errorBox = document.getElementById('errorBox');
  const resultEl = document.getElementById('result');

  const progressCard = document.getElementById('progressCard');
  const progressTitle = document.getElementById('progressTitle');
  const progressElapsed = document.getElementById('progressElapsed');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const progressPct = document.getElementById('progressPct');
  const progressMsg = document.getElementById('progressMsg');
  const stepItems = document.querySelectorAll('#steps li');
  const stepQueuedLabel = document.getElementById('stepQueuedLabel');
  const stepExtractLabel = document.getElementById('stepExtractLabel');

  // ── 상태 ───────────────────────────────────────────────────────
  let selectedFile = null;      // 현재 선택된 File 객체 (분석 버튼 클릭 시 이 값을 전송한다)
  let busy = false;             // 접수 중이거나 작업을 추적 중이면 true (중복 분석 방지)
  let activeJobId = null;       // 지금 추적 중인 작업 ID
  let pollTimer = null;         // 다음 상태 조회를 예약한 setTimeout 핸들
  let elapsedTimer = null;      // 경과 시간 표시를 갱신하는 setInterval 핸들
  let jobStartedAt = 0;         // 경과 시간의 기준 시각(ms). 서버가 알려준 경과 시간으로 보정한다.
  let consecutiveErrors = 0;    // 연속 조회 실패 횟수

  /** 바이트 단위 파일 크기를 사람이 읽기 쉬운 단위(B/KB/MB)로 변환한다. */
  function formatSize(bytes){
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1024/1024).toFixed(1) + ' MB';
  }

  /** 밀리초를 "12초" / "1분 05초" 형태로 변환한다. */
  function formatDuration(ms){
    const sec = Math.max(0, Math.floor(ms / 1000));
    if(sec < 60) return sec + '초';
    return Math.floor(sec / 60) + '분 ' + String(sec % 60).padStart(2, '0') + '초';
  }

  /** 밀리초를 "3.4초" 형태로 변환한다. */
  function formatSeconds(ms){
    return (ms / 1000).toFixed(1) + '초';
  }

  /**
   * 선택/드롭된 파일을 검증하고 화면 상태(파일 정보 표시, 분석 버튼 활성화)를 갱신한다.
   * PDF가 아니거나 20MB를 초과하면 에러를 표시하고 반영하지 않는다.
   */
  function setFile(file){
    if(!file) return;
    if(file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){
      showError('PDF 파일만 업로드할 수 있습니다.');
      return;
    }
    if(file.size > 20 * 1024 * 1024){
      showError('파일 크기는 최대 20MB까지 지원합니다.');
      return;
    }
    selectedFile = file;
    fileName.textContent = file.name;
    fileSize.textContent = formatSize(file.size);
    fileRow.classList.add('show');
    analyzeBtn.disabled = busy;      // 분석이 진행 중이면 새 분석은 끝난 뒤에 시작할 수 있다
    hideError();
    hideResult();
    if(!busy) hideProgress();
  }

  /** 선택된 파일과 관련 UI 상태를 모두 초기화한다 ("제거" 버튼 클릭 시 호출). */
  function clearFile(){
    selectedFile = null;
    fileInput.value = '';
    fileRow.classList.remove('show');
    analyzeBtn.disabled = true;
  }

  // 파일 선택창(클릭)을 통해 파일이 선택된 경우
  fileInput.addEventListener('change', e => setFile(e.target.files[0]));

  // 드래그 중인 파일이 드롭존 위에 있는 동안 시각적 하이라이트 표시
  ['dragover','dragenter'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); })
  );
  // 드래그가 벗어나거나 드롭이 끝나면 하이라이트 해제
  ['dragleave','drop'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); })
  );
  // 실제 드롭된 파일을 선택 파일로 등록
  dropzone.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if(file) setFile(file);
  });

  // "제거" 버튼: 선택된 파일 취소
  fileRemove.addEventListener('click', e => {
    e.preventDefault();
    clearFile();
  });

  /** 에러 메시지 박스를 표시한다. */
  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  /** 에러 메시지 박스를 숨긴다. */
  function hideError(){ errorBox.classList.remove('show'); }
  /** 이전 분석 결과 카드를 숨긴다 (새 파일 선택/재분석 시 초기화 목적). */
  function hideResult(){ resultEl.classList.remove('show'); }

  /** 분석 버튼 옆의 짧은 안내 문구와 스피너를 갱신한다. 문구가 비어 있으면 스피너도 숨긴다. */
  function setStatusText(text){
    statusText.textContent = text || '';
    spinner.classList.toggle('show', !!text);
  }

  /** 분석 진행 여부를 바꾸고 분석 버튼 활성 상태를 맞춘다. */
  function setBusy(value){
    busy = value;
    analyzeBtn.disabled = value || !selectedFile;
  }

  /** 서버 오류 응답(JobStatusResponse 또는 AnalysisResponse)에서 사용자에게 보여줄 문구를 뽑는다. */
  function extractErrorMessage(data){
    if(!data) return null;
    return data.message || data.errorMessage || (data.result && data.result.errorMessage) || null;
  }

  // ── 진행 카드 ─────────────────────────────────────────────────

  function showProgress(){ progressCard.classList.add('show'); }
  function hideProgress(){ progressCard.classList.remove('show'); }

  /** 새 작업을 시작할 때 진행 카드를 초기 상태로 되돌린다. */
  function resetProgress(){
    progressCard.classList.remove('is-ai', 'failed');
    progressTitle.textContent = '분석 진행 중';
    progressElapsed.textContent = '0초';
    progressFill.style.width = '0%';
    progressPct.textContent = '0%';
    progressBar.setAttribute('aria-valuenow', '0');
    progressMsg.textContent = '';
    stepQueuedLabel.textContent = '접수·대기';
    stepExtractLabel.textContent = '텍스트 추출';
    stepItems.forEach(li => li.classList.remove('done', 'active', 'failed'));
  }

  /** 서버가 알려준 처리 단계(stage)를 화면의 4단계 목록 인덱스로 바꾼다. */
  function stepIndexFor(stage){
    switch(stage){
      case 'ANALYZING': return 1;
      case 'EXTRACTING':
      case 'OCR': return 2;
      case 'AI_ANALYSIS': return 3;
      case 'DONE': return 4;      // 모든 단계 완료
      default: return 0;          // QUEUED
    }
  }

  /** 4단계 목록의 완료/진행/실패 표시와 단계별 문구를 갱신한다. */
  function renderSteps(s){
    const current = stepIndexFor(s.stage);
    const failed = s.status === 'FAILED';
    stepItems.forEach((li, i) => {
      li.classList.remove('done', 'active', 'failed');
      if(s.status === 'COMPLETED' || i < current) li.classList.add('done');
      else if(i === current) li.classList.add(failed ? 'failed' : 'active');
    });

    stepQueuedLabel.textContent = (s.status === 'QUEUED' && s.queuePosition > 0)
      ? '대기 (앞에 ' + s.queuePosition + '건)' : '접수·대기';

    // 3단계 문구는 처리 방식(PDFBox / OCR)이 정해지면 그에 맞게 바꾼다.
    if(s.extractionMethod === 'OCR'){
      if(s.stage === 'OCR' && s.totalPages) stepExtractLabel.textContent = 'OCR 처리 (' + (s.currentPage || 0) + '/' + s.totalPages + ' 페이지)';
      else stepExtractLabel.textContent = s.totalPages ? 'OCR 처리 (' + s.totalPages + ' 페이지)' : 'OCR 처리';
    } else if(s.extractionMethod === 'PDFBOX'){
      stepExtractLabel.textContent = '텍스트 추출 (PDFBox)';
    } else {
      stepExtractLabel.textContent = '텍스트 추출';
    }
  }

  /** 진행 카드 아래 안내 문구를 만든다. */
  function progressMessage(s){
    if(s.status === 'RUNNING' && s.stage === 'AI_ANALYSIS'){
      return 'AI 모델이 분류·검증 중입니다. 모델 응답까지 시간이 걸릴 수 있습니다.';
    }
    return s.message || '';
  }

  /** 서버가 돌려준 작업 상태(JobStatusResponse)를 진행 카드에 반영한다. */
  function applySnapshot(s){
    const pct = Math.max(0, Math.min(100, s.progress || 0));
    const running = s.status === 'QUEUED' || s.status === 'RUNNING';

    progressFill.style.width = pct + '%';
    progressPct.textContent = pct + '%';
    progressBar.setAttribute('aria-valuenow', String(pct));
    progressCard.classList.toggle('is-ai', s.status === 'RUNNING' && s.stage === 'AI_ANALYSIS');
    progressCard.classList.toggle('failed', s.status === 'FAILED');

    const title = s.status === 'COMPLETED' ? '분석 완료' : s.status === 'FAILED' ? '분석 실패' : '분석 진행 중';
    progressTitle.textContent = s.fileName ? title + ' · ' + s.fileName : title;
    progressMsg.textContent = progressMessage(s);
    renderSteps(s);

    // 서버 기준 경과 시간으로 보정 (새로고침 후 이어 볼 때도 정확하다)
    if(typeof s.elapsedMs === 'number') jobStartedAt = Date.now() - s.elapsedMs;
    if(!running && typeof s.elapsedMs === 'number') progressElapsed.textContent = formatDuration(s.elapsedMs);
  }

  function renderElapsed(){
    progressElapsed.textContent = formatDuration(Date.now() - jobStartedAt);
  }
  function startElapsedTicker(){
    stopElapsedTicker();
    renderElapsed();
    elapsedTimer = setInterval(renderElapsed, 500);
  }
  function stopElapsedTicker(){
    if(elapsedTimer){ clearInterval(elapsedTimer); elapsedTimer = null; }
  }

  // ── 작업 접수와 상태 조회(폴링) ────────────────────────────────

  // "분석 시작" 버튼: 파일을 접수한 뒤 작업 ID 로 진행 상황을 추적한다.
  analyzeBtn.addEventListener('click', async () => {
    if(!selectedFile || busy) return;
    hideError();
    hideResult();
    resetProgress();
    setBusy(true);
    setStatusText('파일을 업로드하는 중…');

    // 백엔드 DocumentAnalysisController#submitJob 이 요구하는 multipart form key: "file"
    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await fetch(API_BASE + '/jobs', { method: 'POST', body: formData });
      const data = await res.json().catch(() => null);
      if(!res.ok || !data || !data.jobId){
        // 400(파일 없음) / 413(용량 초과) / 422 / 503(대기열 가득 참) 등
        throw new Error(extractErrorMessage(data) || '분석 요청을 접수하지 못했습니다. (HTTP ' + res.status + ')');
      }
      startTracking(data.jobId, data);
    } catch (err) {
      showError(err.message || '서버와 통신 중 오류가 발생했습니다.');
      setStatusText('');
      setBusy(false);
      hideProgress();
    }
  });

  /** 접수된 작업의 진행 상황 추적을 시작한다. firstSnapshot 은 접수/조회 응답 본문. */
  function startTracking(jobId, firstSnapshot){
    activeJobId = jobId;
    consecutiveErrors = 0;
    try { sessionStorage.setItem(JOB_STORAGE_KEY, jobId); } catch (e) { /* 저장소 차단 환경은 무시 */ }

    setBusy(true);
    setStatusText('');
    showProgress();
    jobStartedAt = Date.now();
    applySnapshot(firstSnapshot);
    startElapsedTicker();
    schedulePoll(POLL_INTERVAL_MS);
  }

  function schedulePoll(delay){
    clearTimeout(pollTimer);
    pollTimer = setTimeout(pollOnce, delay);
  }

  /** 상태를 한 번 조회하고, 종료 전이면 다음 조회를 예약한다. (요청이 끝난 뒤에 예약하므로 겹치지 않는다.) */
  async function pollOnce(){
    const jobId = activeJobId;
    if(!jobId) return;
    try {
      const res = await fetch(API_BASE + '/jobs/' + encodeURIComponent(jobId), { cache: 'no-store' });
      if(jobId !== activeJobId) return;          // 조회 중에 추적 대상이 바뀐 경우 응답 무시

      if(res.status === 404){
        stopTracking(true);
        showError('분석 작업을 찾을 수 없습니다. 서버가 재시작되었거나 보관 기간이 지났을 수 있습니다. 파일을 다시 올려 주세요.');
        return;
      }
      if(!res.ok) throw new Error('HTTP ' + res.status);

      const snap = await res.json();
      if(jobId !== activeJobId) return;
      consecutiveErrors = 0;
      setStatusText('');
      applySnapshot(snap);
      if(snap.status === 'COMPLETED' || snap.status === 'FAILED'){
        finishTracking(snap);
        return;
      }
    } catch (err) {
      consecutiveErrors++;
      if(consecutiveErrors >= MAX_POLL_ERRORS){
        // 작업 ID 는 남겨 두므로, 서버가 살아나면 새로고침으로 이어서 볼 수 있다.
        stopTracking(false);
        showError('진행 상태를 확인하지 못했습니다(' + err.message + '). 서버에서는 분석이 계속되고 있을 수 있으니, 잠시 후 페이지를 새로고침하면 이어서 확인합니다.');
        return;
      }
      setStatusText('서버 응답이 지연되고 있습니다. 다시 시도합니다 (' + consecutiveErrors + '/' + MAX_POLL_ERRORS + ')');
    }
    if(jobId === activeJobId) schedulePoll(POLL_INTERVAL_MS);
  }

  /** 타이머를 모두 멈추고 추적을 끝낸다. forget 이 true 면 새로고침 이어보기용 작업 ID 도 지운다. */
  function stopTracking(forget){
    clearTimeout(pollTimer);
    pollTimer = null;
    stopElapsedTicker();
    activeJobId = null;
    if(forget){
      try { sessionStorage.removeItem(JOB_STORAGE_KEY); } catch (e) { /* 무시 */ }
    }
    setStatusText('');
    setBusy(false);
  }

  /** 작업이 종료(COMPLETED/FAILED)되었을 때 결과 또는 오류를 표시한다. */
  function finishTracking(snap){
    stopTracking(true);
    progressCard.classList.remove('is-ai');
    if(typeof snap.elapsedMs === 'number') progressElapsed.textContent = formatDuration(snap.elapsedMs);

    if(snap.status === 'COMPLETED' && snap.result){
      renderResult(snap.result, snap);
    } else {
      showError(extractErrorMessage(snap.result) || snap.message || '문서 분석에 실패했습니다.');
    }
  }

  /** 페이지를 새로 열었을 때, 진행 중이던 작업이 있으면 이어서 추적한다. */
  async function resumeTrackedJob(){
    let jobId = null;
    try { jobId = sessionStorage.getItem(JOB_STORAGE_KEY); } catch (e) { return; }
    if(!jobId) return;
    try {
      const res = await fetch(API_BASE + '/jobs/' + encodeURIComponent(jobId), { cache: 'no-store' });
      if(!res.ok){                                   // 만료/재시작 등: 조용히 정리
        try { sessionStorage.removeItem(JOB_STORAGE_KEY); } catch (e) { /* 무시 */ }
        return;
      }
      const snap = await res.json();
      resetProgress();
      showProgress();
      applySnapshot(snap);
      if(snap.status === 'COMPLETED' || snap.status === 'FAILED') finishTracking(snap);
      else startTracking(jobId, snap);
    } catch (err) {
      /* 서버에 연결할 수 없으면 이어보기를 포기한다 (작업 ID 는 남겨 둔다) */
    }
  }

  // ── 결과 렌더링 ───────────────────────────────────────────────

  /**
   * 최종 분석 결과(AnalysisResponse)를 화면에 렌더링한다.
   * snap 이 주어지면 소요 시간(총 시간과 단계별 시간)도 함께 표시한다.
   */
  function renderResult(data, snap){
    if(!data.success){
      showError(data.errorMessage || '문서 분석에 실패했습니다.');
      return;
    }

    const r = data.result || {};
    document.getElementById('resFile').textContent = data.fileName || '';
    document.getElementById('resCategory').textContent = r.category || '분류 결과 없음';
    document.getElementById('resMethod').textContent = data.extractionMethod || '-';

    // 서버는 verification_status(스네이크 케이스)로 내려주므로 두 이름을 모두 허용한다.
    const status = r.verification_status || r.verificationStatus || '-';
    const badge = document.getElementById('resBadge');
    badge.textContent = status;
    const isOk = status === '정상';
    badge.className = 'badge ' + (isOk ? 'ok' : 'warn');

    // confidence는 0.0~1.0 범위의 실수이므로 퍼센트로 변환해 바(bar)와 텍스트로 표시
    const conf = r.confidence != null ? r.confidence : 0;
    const pct = Math.round(conf * 100);
    document.getElementById('confFill').style.width = pct + '%';
    document.getElementById('confPct').textContent = pct + '%';

    // 소요 시간: 총 시간 + 단계별 시간(0.1초 이상인 단계만). 병목 확인에 쓸 수 있다.
    const timeRow = document.getElementById('resTimeRow');
    if(snap && typeof snap.elapsedMs === 'number'){
      document.getElementById('resTime').textContent = formatTimings(snap);
      timeRow.style.display = '';
    } else {
      timeRow.style.display = 'none';
    }

    // 이상 징후 목록이 있을 때만 안내 박스를 렌더링 (없으면 비워서 숨김)
    const anomaliesWrap = document.getElementById('anomaliesWrap');
    const anomalies = r.anomalies || [];
    if(anomalies.length > 0){
      anomaliesWrap.innerHTML = `
        <div class="anomalies">
          <div class="anomalies-title">감지된 이상 징후</div>
          <ul>${anomalies.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ul>
        </div>`;
    } else {
      anomaliesWrap.innerHTML = '';
    }

    resultEl.classList.add('show');
  }

  const TIMING_LABELS = {
    queued: '대기', analyzing: 'PDF 분석', extracting: '텍스트 추출', ocr: 'OCR', aiAnalysis: 'AI 분류·검증'
  };

  /** 예: "총 18.4초 (PDF 분석 0.3초 · AI 분류·검증 17.9초)" */
  function formatTimings(snap){
    const parts = [];
    Object.keys(TIMING_LABELS).forEach(key => {
      const ms = snap.timingsMs && snap.timingsMs[key];
      if(ms >= 100) parts.push(TIMING_LABELS[key] + ' ' + formatSeconds(ms));
    });
    return '총 ' + formatSeconds(snap.elapsedMs) + (parts.length ? ' (' + parts.join(' · ') + ')' : '');
  }

  /** XSS 방지를 위해 텍스트를 HTML 엔티티로 이스케이프한다 (이상 징후 목록 렌더링 시 사용). */
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // 페이지가 열릴 때, 진행 중이던 작업이 있으면 이어서 추적한다.
  resumeTrackedJob();
</script>
</body>
</html>
